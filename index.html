<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="top">
        <h1>Taro's Portfolio</h1>
    </div>

    <div id="about">
        <h2>About</h2>
        <hr class="blue-line">

        <img src="image/man.png" alt="プロフィール画像">

        <table>
            <tr>
                <td>名前</td>
                <td>：ああああ</td>
            </tr>
            <tr>
                <td>現在地</td>
                <td>：？</td>
            </tr>
            <tr>
                <td>お問い合わせ</td>
                <td>：sample@example.com</td>
            </tr>
        </table>

        <p>
            こんにちは。高校一年生のあああです。<br>
            プログラミングを頑張っています。
        </p>
    </div>

    <div id="skills">
        <h2>好きなもの</h2>
        <hr class="white-line">

        <div class="container">
            <div class="box">
                <img src="image/html.png" alt="HTML5">
                <b>ラーメン</b>
            </div>

            <div class="box">
                <img src="image/css.png" alt="CSS3">
                <b>YouTube</b>
            </div>

            <div class="box">
                <img src="image/ps.png" alt="Photoshop">
                <b>TikTok</b>
            </div>

            <div class="box">
                <img src="image/ai.png" alt="Illustrator">
                <b>ヴァロラント</b>
            </div>
        </div>
    </div>

    <div id="portfolio">
        <h2>好きな場所</h2>
        <hr class="blue-line">

        <div class="container">
            <div class="card">
                <img src="image/hp1.jpg" alt="カフェHP">
                <h3>読売ランド</h3>
                <p></p>
            </div>

            <div class="card">
                <img src="image/hp2.jpg" alt="クリニックHP">
                <h3>2年前</h3>
                <p></p>
            </div>
        </div>
    </div>

    <footer></footer>

</body>

</html>
